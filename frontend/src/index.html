oke-linecap:round;stroke-linejoin:round}.chart .area{fill:url(#area)}.chart .dot{fill:white;stroke:#789944;stroke-width:2}.legend{display:flex;align-items:center;gap:7px;color:#828a97;font-size:9px;padding:0 4px}.legend-dot{width:7px;height:7px;border-radius:50%;background:#91b653}.chart-note{color:#a1a7b1;font-size:9px;margin-left:auto}.health-list{padding:0 17px 8px}.health-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:9px;padding:11px 0;border-top:1px solid #f0f1f4}.health-name{font-size:10px;font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.health-host{font-size:9px;color:#9299a5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.health-state{font-size:9px;display:flex;align-items:center;gap:5px;color:#6d9260}.health-state .status-dot{background:#8ebd64}.health-foot{padding:8px 17px 14px;font-size:9px;color:#9097a3}.section-row{display:flex;justify-content:space-between;align-items:center;padding:19px 1px 10px}.section-row h2{font-size:13px;margin:0;font-weight:680}.view-link{font-size:10px;color:#687f43;background:none;border:0}.table-panel{overflow:hidden}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#9299a5;font-size:9px;letter-spacing:.45px;text-transform:uppercase;font-weight:650;padding:11px 15px;border-bottom:1px solid #eef0f4}td{padding:11px 15px;border-bottom:1px solid #f0f1f4;font-size:10px}tr:last-child td{border-bottom:0}.product-cell{display:flex;align-items:center;gap:9px}.product-art{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#697e4b;background:#edf3e3;font-size:12px}.product-name{font-size:10px;font-weight:630}.product-brand{font-size:9px;color:#9299a5;margin-top:1px}.price{font-weight:650}.change-pill{display:inline-flex;align-items:center;gap:3px;border-radius:5px;padding:3px 6px;font-size:9px;font-weight:650}.change-pill.down{background:#fff0ed;color:#c86658}.change-pill.up{background:# <body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">M</div><div class="brand-copy">marketpulse<small>market intelligence</small></div></div>
    <div class="workspace-switch"><div class="workspace-avatar">N</div><div class="workspace-name">Northstar Research<div class="workspace-label">Workspace</div></div><span class="chevron">⌄</span></div>
    <div class="nav-label">Workspace</div>
    <nav class="nav" aria-label="Main navigation">
      <button class="active" data-page="overview"><span class="nav-icon">◫</span><span>Overview</span></button>
      <button data-page="projects"><span class="nav-icon">▤</span><span>Projects</span><span class="nav-count" id="nav-projects">06</span></button>
      <button data-page="listings"><span class="nav-icon">⌕</span><span>Listings</span><span class="nav-count" id="nav-listings">1.2k</span></button>
      <button data-page="changes"><span class="nav-icon">↗</span><span>Price changes</span><span class="nav-count" id="nav-changes">64</span></button>
    </nav>
    <div class="sidebar-bottom">
      <div class="side-note"><strong>MarketPulse keeps watch.</strong><p>One clear view of listings, availability, and price movement across your market.</p></div>
      <div class="profile"><div class="profile-avatar">AR</div><div class="profile-text" id="profile-name">Alex Rivera<span class="profile-sub">Research analyst</span></div></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="crumb">Workspace <span style="padding:0 7px;color:#c0c4cc">/</span><span id="crumb-page">Overview</span></div><div class="top-actions"><div class="demo-status" id="mode-status"><span class="status-dot"></span><span>Sample workspace</span></div><button class="icon-button" title="Notifications" aria-label="Notifications">♧</button><button class="signin" id="signin-open">Sign in</button></div></header>
    <div class="page" id="page-content"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="/config.js"></script>
<script>
const API=window.MARKETPULSE_API||'/api/v1';
const PREVIEW_ONLY=window.MARKETPULSE_PREVIEW_ONLY===true;
const $=s=>document.querySelector(s);
const demo={projects:[
  {id:'p1',name:'Audio & personal tech',category:'E-commerce',sources:5,listings:428,delta:'+8.2%',mark:'A'},
  {id:'p2',name:'Home office essentials',category:'E-commerce',sources:4,listings:316,delta:'+3.6%',mark:'H'},
  {id:'p3',name:'Smart home devices',category:'Market research',sources:3,listings:204,delta:'−1.4%',mark:'S'},
  {id:'p4',name:'Outdoor & fitness',category:'E-commerce',sources:3,listings:187,delta:'+5.1%',mark:'O'},
  {id:'p5',name:'Coffee equipment',category:'Market research',sources:3,listings:113,delta:'+2.8%',mark:'C'},
  {id:'p6',name:'Wearables watchlist',category:'E-commerce',sources:2,listings:96,delta:'+4.3%',mark:'W'}
],listings:[
  {id:1,title:'AeroBeat Pro wireless earbuds',seller:'Northstar Audio',category:'Audio',price:129,delta:'−8.3%',tone:'down',availability:'In stock',icon:'◖'},
  {id:2,title:'Halo task lamp, matte graphite',seller:'Form & Field',category:'Home',price:84.5,delta:'−6.1%',tone:'down',availability:'In stock',icon:'◉'},
  {id:3,title:'StudioKeys mechanical keyboard',seller:'Keywork Supply',category:'Computing',price:149,delta:'+4.7%',tone:'up',availability:'In stock',icon:'⌨'},
  {id:4,title:'Brewcraft precision grinder',seller:'Brewcraft Co.',category:'Kitchen',price:219,delta:'−3.2%',tone:'down',availability:'Low stock',icon:'◌'},
  {id:5,title:'Trailmark GPS sport watch',seller:'Trailmark',category:'Fitness',price:279,delta:'+2.4%',tone:'up',availability:'In stock',icon:'◷'}
],sources:[
  {name:'Northstar Audio',host:'northstaraudio.example',state:'Healthy',runs:'2 min ago'},
  {name:'Form & Field',host:'formandfield.example',state:'Healthy',runs:'8 min ago'},
  {name:'Keywork Supply',host:'keyworksupply.example',state:'Healthy',runs:'14 min ago'},
  {name:'Brewcraft Co.',host:'brewcraft.example',state:'Healthy',runs:'22 min ago'}
],changes:[
  {title:'AeroBeat Pro wireless earbuds',seller:'Northstar Audio',old:'$140.70',value:'$129.00',delta:'−8.3%',tone:'down',time:'12 min ago'},
  {title:'Halo task lamp, matte graphite',seller:'Form & Field',old:'$90.00',value:'$84.50',delta:'−6.1%',tone:'down',time:'34 min ago'},
  {title:'StudioKeys mechanical keyboard',seller:'Keywork Supply',old:'$142.30',value:'$149.00',delta:'+4.7%',tone:'up',time:'1 hr ago'},
  {title:'Brewcraft precision grinder',seller:'Brewcraft Co.',old:'$226.25',value:'$219.00',delta:'−3.2%',tone:'down',time:'2 hr ago'},
  {title:'Trailmark GPS sport watch',seller:'Trailmark',old:'$272.45',value:'$279.00',delta:'+2.4%',tone:'up',time:'3 hr ago'}
]};
let state={token:PREVIEW_ONLY?null:sessionStorage.getItem('mp-token'),page:'overview',projects:[],listings:[],changes:[],sources:[],loading:false};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(v,c='USD'){if(v==null)return '—';try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c,maximumFractionDigits:2}).format(Number(v))}catch{return String(v)}}
function ago(d){if(!d)return '—';const m=Math.max(0,Math.floor((Date.now()-new Date(d).getTime())/60000));return m<1?'Just now':m<60?`${m} min ago`:m<1440?`${Math.floor(m/60)} hr ago`:new Date(d).toLocaleDateString()}
async function request(path,options={}){const r=await fetch(API+path,{...options,headers:{'Content-Type':'application/json',...(state.token?{Authorization:`Bearer ${state.token}`}:{}) ,...options.headers}});if(!r.ok){let e={};try{e=await r.json()}catch{}throw Error(e.detail||`Request failed (${r.status})`)}return r.status===204?null:r.json()}
function setPage(page){state.page=page;history.replaceState(null,'',`#${page}`);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#crumb-page').textContent=({overview:'Overview',projects:'Projects',listings:'Listings',changes:'Price changes'})[page];render()}
function metric(label,value,foot,icon){return `<article class="metric"><div class="metric-top"><span>${label}</span><span class="metric-icon">${icon}</span></div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></article>`}
function chart(){return `<svg class="chart" viewBox="0 0 700 205" preserveAspectRatio="none" role="img" aria-label="Sample listings monitored over 30 days"><defs><linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#a9cc70" stop-opacity=".24"/><stop offset="1" stop-color="#a9cc70" stop-opacity="0"/></linearGradient></defs><line class="gridline" x1="42" y1="25" x2="690" y2="25"/><line class="gridline" x1="42" y1="68" x2="690" y2="68"/><line class="gridline" x1="42" y1="111" x2="690" y2="111"/><line class="gridline" x1="42" y1="154" x2="690" y2="154"/><text x="1" y="28">1,300</text><text x="1" y="71">1,200</text><text x="1" y="114">1,100</text><text x="1" y="157">1,000</text><path class="area" d="M42 144 C70 139 78 128 104 131 S146 121 168 126 S206 110 230 117 S268 98 292 105 S334 91 354 97 S396 84 418 92 S454 73 480 82 S520 66 545 73 S581 57 605 67 S644 47 690 39 L690 164 L42 164Z"/><path class="line" d="M42 144 C70 139 78 128 104 131 S146 121 168 126 S206 110 230 117 S268 98 292 105 S334 91 354 97 S396 84 418 92 S454 73 480 82 S520 66 545 73 S581 57 605 67 S644 47 690 39"/><circle class="dot" cx="690" cy="39" r="4"/><text x="42" y="187">−30d</text><text x="194" y="187">−21d</text><text x="353" y="187">−14d</text><text x="512" y="187">−7d</text><text x="653" y="187">Today</text></svg>`}
function listingRows(rows){return rows.slice(0,5).map(x=>`<tr><td><div class="product-cell"><div class="product-art">${esc(x.icon||'◈')}</div><div><div class="product-name">${esc(x.title)}</div><div class="product-brand">${esc(x.seller||x.brand||'Marketplace listing')}</div></div></div></td><td>${esc(x.category||'—')}</td><td class="price">${x.price!=null?money(x.price,x.currency||'USD'):esc(x.priceText||'—')}</td><td><span class="change-pill ${x.tone||'neutral'}">${esc(x.delta||'No change')}</span></td><td><span class="source-status"><span class="status-dot" style="background:${x.availability==='Low stock'?'#d8a451':''}"></span>${esc(x.availability||'Tracked')}</span></td></tr>`).join('')||`<tr><td colspan="5" class="empty">No listings collected yet. Add a source and run it to populate this table.</td></tr>`}
function changeRows(rows){return rows.slice(0,5).map(x=>`<tr><td><div class="product-name">${esc(x.title||'Listing')}</div><div class="product-brand">${esc(x.seller||'')}</div></td><td>${esc(x.old||x.old_value||'—')} <span style="color:#a0a5af">→</span> ${esc(x.value||x.new_value||'—')}</td><td><span class="change-pill ${x.tone||((x.event_type||'').includes('decrease')?'down':(x.event_type||'').includes('increase')?'up':'neutral')}">${esc(x.delta||(x.pct_change!=null?`${x.pct_change}%`:x.event_type||'Change'))}</span></td><td>${esc(x.time||ago(x.detected_at))}</td></tr>`).join('')||`<tr><td colspan="4" class="empty">No changes detected yet. Price and availability changes appear here after a successful run.</td></tr>`}
function projectsRows(rows){return rows.slice(0,5).map(p=>{const sourceCount=p.sourceCount??(typeof p.sources==='number'?p.sources:p.sources?.length??0);const listingCount=p.listingCount??(typeof p.listings==='number'?p.listings:p.listings?.length??0);return `<div class="project-row"><div class="project-mark">${esc((p.name||'P').slice(0,1).toUpperCase())}</div><div><div class="project-name">${esc(p.name)}</div><div class="project-meta">${esc(p.category||'Market research')} · ${Number(sourceCount)} sources</div></div><div class="project-total">${Number(listingCount).toLocaleString()}<span>listings</span></div></div>`}).join('')||`<div class="empty">No projects yet. Create a project to start tracking your market.</div>`}
function heading(title,desc,action=true){return `<div class="heading-row"><div><div class="eyebrow">${state.token?'Workspace dashboard':'Independent product concept'}</div><h1>${title}</h1><p>${desc}</p></div>${action?'<button class="primary" data-action="new-project"><span class="plus">+</span>New project</button>':''}</div>`}
function overview(){const demoMode=!state.token;const projects=demoMode?demo.projects:state.projects;const listings=demoMode?demo.listings:state.listings;const changes=demoMode?demo.changes:state.changes;const sources=demoMode?demo.sources:state.sources;const srcCount=demoMode?18:sources.length;const tracked=demoMode?1248:listings.filter(x=>!x.removed_at).length;const changeCount=demoMode?64:changes.length;const demoAction=PREVIEW_ONLY?'<span class="banner-spacer"></span><span class="demo-capsule">Read-only product demo</span>':'<span class="banner-spacer"></span><button class="text-button" data-action="signin">Connect your workspace →</button>';return `${demoMode?`<div class="demo-banner"><span class="demo-tag">Preview</span><strong>Sample workspace</strong><span>Explore the MarketPulse dashboard with illustrative data.</span>${demoAction}</div>`:''}${heading('Market overview','A clear read on what is moving across your market.')}
    <section class="metrics">${metric('Tracked listings',demoMode?'1,248':tracked.toLocaleString(),demoMode?'<span class="positive">+8.4%</span> vs. last month':'Across active projects','◈')}${metric('Active sources',demoMode?'18':srcCount,demoMode?'<span class="positive">All sources healthy</span>':'Configured monitors','⌁')}${metric('Price changes',demoMode?'64':changeCount,demoMode?'<span class="negative">12 significant</span>':'Latest successful runs','↗')}${metric('Projects',demoMode?'06':projects.length,'Market watchlists','▤')}</section>
    <section class="grid-main"><article class="panel"><div class="panel-head"><div><div class="panel-title">Market coverage</div><div class="panel-subtitle">Listings monitored over the past 30 days</div></div><button class="period">Last 30 days⌄</button></div><div class="chart-wrap">${chart()}<div class="legend"><span class="legend-dot"></span>Listings tracked <span class="chart-note">${demoMode?'Illustrative preview data':'Historical chart endpoint planned'}</span></div></div></article><article class="panel"><div class="panel-head"><div><div class="panel-title">Source health</div><div class="panel-subtitle">Recent collection activity</div></div><button class="view-link" data-page="projects">View sources →</button></div><div class="health-list">${sources.slice(0,4).map(s=>`<div class="health-row"><div><div class="health-name">${esc(s.name)}</div><div class="health-host">${esc(s.host||s.url||'Source URL')}</div></div><div class="health-state"><span class="status-dot" style="${s.state==='Not run'?'background:#d8a451':''}"></span>${esc(s.state||'Connected')}</div></div>`).join('')||'<div class="empty">No sources connected yet.</div>'}</div><div class="health-foot">${demoMode?'Sample collection status':'Statuses update after a source run'}</div></article></section>
    <div class="section-row"><h2>Recent listing changes</h2><button class="view-link" data-page="changes">View all changes →</button></div><section class="panel table-panel"><div class="table-wrap"><table><thead><tr><th>Listing</th><th>Category</th><th>Current price</th><th>Change</th><th>Availability</th></tr></thead><tbody>${listingRows(listings)}</tbody></table></div></section>
    <section class="lower-grid"><article class="panel"><div class="panel-head"><div><div class="panel-title">Project watchlists</div><div class="panel-subtitle">Your market research, organized</div></div><button class="view-link" data-page="projects">All projects →</button></div><div class="project-list">${projectsRows(projects)}</div></article><article class="panel"><div class="panel-head"><div><div class="panel-title">Latest price movement</div><div class="panel-subtitle">Changes from monitored sources</div></div></div><div class="table-wrap"><table><thead><tr><th>Listing</th><th>Price</th><th>Move</th><th>Detected</th></tr></thead><tbody>${changeRows(changes)}</tbody></table></div></article></section><div class="footer"><span>${demoMode?'All numbers shown are illustrative sample data.':'Live workspace data'}</span><span>MarketPulse · Market intelligence, in focus</span></div>`}
function pageView(){const demoMode=!state.token;const projects=demoMode?demo.projects:state.projects;const listings=demoMode?demo.listings:state.listings;const changes=demoMode?demo.changes:state.changes;if(state.page==='overview')return overview();if(state.page==='projects')return `${heading('Projects','Focused watchlists for the markets you follow.')}${projects.length?`<section class="lower-grid">${projects.map(p=>`<article class="panel"><div class="panel-head"><div><div class="project-name">${esc(p.name)}</div><div class="panel-subtitle">${esc(p.category||'Market research')}</div></div><span class="demo-tag">${demoMode?'Sample':'Active'}</span></div><div class="project-list"><div class="project-row"><div class="metric-icon">⌁</div><div><div class="project-name">Sources</div><div class="project-meta">${Number(p.sourceCount??p.sources??0)} connected</div></div></div><div class="project-row"><div class="metric-icon">◈</div><div><div class="project-name">Listings</div><div class="project-meta">Current tracked inventory</div><div class="project-total">${Number(p.listingCount??p.listings??0).toLocaleString()}</div></div></div>${!demoMode?`<button class="primary" data-action="add-source" data-project="${p.id}"><span class="plus">+</span>Add source</button>`:''}</div></article>`).join('')}</section>`:'<article class="panel empty">No projects yet. Create one to get started.</article>'}`;if(state.page==='listings')return `${heading('Tracked listings','Current listing state across your projects.',false)}<section class="panel table-panel"><div class="table-wrap"><table><thead><tr><th>Listing</th><th>Category</th><th>Current price</th><th>Change</th><th>Availability</th></tr></thead><tbody>${listingRows(listings)}</tbody></table></div></section><div class="footer"><span>${demoMode?'Sample preview':'Showing latest records returned by the API'}</span><span>${listings.length.toLocaleString()} records</span></div>`;return `${heading('Price changes','Price and availability events captured from your latest runs.',false)}<section class="panel table-panel"><div class="table-wrap"><table><thead><tr><th>Listing</th><th>Price movement</th><th>Change type</th><th>Detected</th></tr></thead><tbody>${changeRows(changes)}</tbody></table></div></section><div class="footer"><span>${demoMode?'Sample preview':'Changes from successful source runs'}</span><span>${changes.length.toLocaleString()} events</span></div>`}
function render(){ $('#page-content').innerHTML=state.loading?'<div class="loading">Loading your workspace…</div>':pageView();bindActions()}
function bindActions(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));document.querySelectorAll('[data-action="new-project"]').forEach(b=>b.onclick=()=>state.token?openModal('project'):PREVIEW_ONLY?toast('This read-only demo uses sample data.'):openModal('login'));document.querySelectorAll('[data-action="signin"]').forEach(b=>b.onclick=()=>PREVIEW_ONLY?toast('This read-only demo uses sample data.'):openModal('login'));document.querySelectorAll('[data-action="add-source"]').forEach(b=>b.onclick=()=>openModal('source',b.dataset.project))}
async function loadLive(){if(!state.token){render();return}state.loading=true;render();try{state.projects=await request('/projects');const groups=await Promise.all(state.projects.map(async p=>{const [sources,listings,changes]=await Promise.all([request(`/projects/${p.id}/sources`),request(`/projects/${p.id}/listings`),request(`/projects/${p.id}/changes`)]);return {p,sources,listings,changes}}));state.sources=groups.flatMap(g=>g.sources.map(s=>({...s,state:s.last_success_at?'Healthy':'Not run'})));state.listings=groups.flatMap(g=>g.listings);const byId=new Map(state.listings.map(x=>[x.id,x]));state.changes=groups.flatMap(g=>g.changes.map(x=>({...x,...(byId.has(x.snapshot_id)?{title:byId.get(x.snapshot_id).title,seller:byId.get(x.snapshot_id).seller}:{} )})));for(const g of groups){g.p.sourceCount=g.sources.length;g.p.listingCount=g.listings.length}state.changes.sort((a,b)=>new Date(b.detected_at)-new Date(a.detected_at));$('#mode-status').innerHTML='<span class="status-dot"></span><span>Live workspace</span>';$('#signin-open').textContent='Sign out';$('#signin-open').onclick=logout;$('#profile-name').innerHTML='Workspace member<span class="profile-sub">Market analyst</span>';$('#nav-projects').textContent=state.projects.length;$('#nav-listings').textContent=state.listings.length>999?`${(state.listings.length/1000).toFixed(1)}k`:state.listings.length;$('#nav-changes').textContent=state.changes.length;state.loading=false;render()}catch(e){state.loading=false;toast(`Could not load workspace: ${e.message}`);state.token=null;sessionStorage.removeItem('mp-token');$('#mode-status').innerHTML='<span class="status-dot"></span><span>Sample workspace</span>';$('#signin-open').textContent='Sign in';$('#signin-open').onclick=()=>openModal('login');render()}}
function toast(message){$('#toast-root').innerHTML=`<div class="toast">${esc(message)}</div>`;setTimeout(()=>$('#toast-root').innerHTML='',3500)}
function closeModal(){ $('#modal-root').innerHTML='' }
function openModal(kind,projectId=''){const isLogin=kind==='login';const isProject=kind==='project';const title=isLogin?'Welcome back':isProject?'Create a project':'Connect a source';const desc=isLogin?'Sign in to view and manage your live workspace.':isProject?'Create a focused watchlist for a market you follow.':'Choose a source and tell MarketPulse how to read its listings.';let fields='';if(isLogin)fields='<div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div>';if(isProject)fields='<div class="field"><label>Project name</label><input name="name" required maxlength="200" placeholder="e.g. Home audio market"></div><div class="field"><label>Category</label><select name="category"><option value="market_research">Market research</option><option value="ecommerce">E-commerce</option><option value="real_estate">Real estate</option><option value="recruiting">Recruiting</option></select></div>';if(kind==='source')fields='<div class="field"><label>Source name</label><input name="name" required placeholder="Store or marketplace name"></div><div class="field"><label>Source URL</label><input name="url" type="url" required placeholder="https://example.com"></div><div class="field"><label>Page type</label><select name="scraper_type"><option value="static">Static HTML</option><option value="javascript">JavaScript-rendered HTML</option><option value="api">JSON API</option></select></div><div class="field"><label>Field selectors (JSON)</label><textarea name="selectors" required placeholder="{&quot;item&quot;:&quot;article.product&quot;,&quot;title&quot;:&quot;h2&quot;,&quot;url&quot;:{&quot;selector&quot;:&quot;a&quot;,&quot;attr&quot;:&quot;href&quot;},&quot;price&quot;:&quot;.price&quot;}"></textarea></div>';$('#modal-root').innerHTML=`<div class="modal-backdrop" data-backdrop><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">${title}</h2><p>${desc}</p></div><button class="close" data-close aria-label="Close">×</button></div><form id="modal-form">${fields}<div class="modal-error" id="modal-error"></div><button class="primary" type="submit">${isLogin?'Sign in':isProject?'Create project':'Add source'}</button></form>${isLogin?'<div class="modal-switch">First time here? <button type="button" data-register>Set up a workspace</button></div>':''}</section></div>`;document.querySelector('[data-close]').onclick=closeModal;document.querySelector('[data-backdrop]').onclick=e=>{if(e.target===e.currentTarget)closeModal()};const reg=document.querySelector('[data-register]');if(reg)reg.onclick=openRegister;$('#modal-form').onsubmit=e=>submitModal(e,kind,projectId)}
function openRegister(){const html='<div class="field"><label>Workspace name</label><input name="workspace_name" required maxlength="120"></div><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Password (12+ characters)</label><input name="password" type="password" minlength="12" required autocomplete="new-password"></div>';$('#modal-root').innerHTML=`<div class="modal-backdrop" data-backdrop><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><h2>Create your workspace</h2><p>The first account becomes the workspace administrator.</p></div><button class="close" data-close>×</button></div><form id="modal-form">${html}<div class="modal-error" id="modal-error"></div><button class="primary">Create workspace</button></form><div class="modal-switch">Already registered? <button data-login>Sign in</button></div></section></div>`;document.querySelector('[data-close]').onclick=closeModal;document.querySelector('[data-login]').onclick=()=>openModal('login');$('#modal-form').onsubmit=e=>submitModal(e,'register')}
async function submitModal(e,kind,projectId){e.preventDefault();const form=e.currentTarget;const data=Object.fromEntries(new FormData(form));const error=$('#modal-error');error.textContent='';try{if(kind==='login'||kind==='register'){const path=kind==='login'?'/auth/login':'/auth/register';const result=await request(path,{method:'POST',body:JSON.stringify(data)});state.token=result.access_token;sessionStorage.setItem('mp-token',state.token);closeModal();await loadLive();return}if(kind==='project'){await request('/projects',{method:'POST',body:JSON.stringify({...data,filters:{},notify_emails:[]})});closeModal();await loadLive();toast('Project created');return}const selectors=JSON.parse(data.selectors);delete data.selectors;await request(`/projects/${projectId}/sources`,{method:'POST',body:JSON.stringify({...data,selectors})});closeModal();await loadLive();toast('Source added')}catch(err){error.textContent=err instanceof SyntaxError?'Selectors must be valid JSON.':err.message}}
function logout(){state.token=null;sessionStorage.removeItem('mp-token');state.projects=[];state.listings=[];state.changes=[];state.sources=[];$('#mode-status').innerHTML='<span class="status-dot"></span><span>Sample workspace</span>';$('#signin-open').textContent='Sign in';$('#signin-open').onclick=()=>openModal('login');$('#profile-name').innerHTML='Alex Rivera<span class="profile-sub">Research analyst</span>';render();toast('Signed out')}
async function init(){document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('#signin-open').textContent=PREVIEW_ONLY?'Demo only':'Sign in';$('#signin-open').onclick=()=>PREVIEW_ONLY?toast('This read-only demo uses sample data.'):state.token?logout():openModal('login');if(PREVIEW_ONLY)$('#signin-open').disabled=true;const requested=location.hash.slice(1);setPage(['overview','projects','listings','changes'].includes(requested)?requested:'overview');if(state.token&&!PREVIEW_ONLY)await loadLive()}
init();
</script>
</body>
</html>
