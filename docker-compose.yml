services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    depends_on: {db: {condition: service_healthy}}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes: [reports:/app/reports]
  frontend:
    build: ./frontend
    depends_on: [api]
    environment:
      MARKETPULSE_API_URL: http://localhost:8000/api/v1
    ports: ["3000:80"]
volumes:
  pgdata:
  reports:
